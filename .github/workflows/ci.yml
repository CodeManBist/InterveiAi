
name: InterviewAI CI

# WHEN should this workflow execute?
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

# WHAT jobs should execute?
jobs:

  # BACKEND JOB
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    # Execute shell commands from backend/
    defaults:
      run:
        working-directory: backend

    steps:
      # Step 1: Get repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Step 3: Install backend dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run backend tests
      - name: Run backend tests
        run: npm test

      # Step 5: Compile TypeScript
      - name: Build backend
        run: npm run build


  # FRONTEND JOB
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    # Execute shell commands from frontend/
    defaults:
      run:
        working-directory: frontend

    steps:
      # Step 1: Get repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Install frontend dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run frontend tests
      - name: Run frontend tests
        run: npm test

      # Step 5: Check code quality
      - name: Run ESLint
        run: npm run lint

      # Step 6: Build frontend
      - name: Build frontend
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_dummy
